name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac --arm64
          - os: macos-15-intel
            target: --mac --x64
          - os: windows-latest
            target: --win --x64
          - os: ubuntu-22.04
            target: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run desktop:prepare
      - run: npm run desktop:smoke
      - run: npm run desktop:package -- ${{ matrix.target }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: AutoSetter-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: AutoSetter-*
          merge-multiple: true
          path: release
      - name: Verify complete release and checksums
        run: |
          test -s release/Autosetter-macOS-arm64.dmg
          test -s release/Autosetter-macOS-x64.dmg
          test -s release/Autosetter-Windows-x64.exe
          test -s release/Autosetter-Linux-x64.AppImage
          test -s release/Autosetter-Linux-x64.deb
          cd release
          sha256sum *.dmg *.exe *.AppImage *.deb > SHA256SUMS.txt
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "AutoSetter $GITHUB_REF_NAME" --notes-file desktop/RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
